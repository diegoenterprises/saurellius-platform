{% extends "base.html" %}
{% block title %}Edit Employee - Saurellius{% endblock %}
{% block content %}
<div class="dashboard-wrapper">
    <aside class="dashboard-sidebar">
        <ul class="sidebar-menu">
            <li><a href="/dashboard">📊 Dashboard</a></li>
            <li><a href="/paystub-generator">🚀 Generate Paystub</a></li>
            <li><a href="/paystub-history">📄 History</a></li>
            <li><a href="/ytd-summary">📈 YTD Summary</a></li>
            <li><a href="/rewards">🏆 Rewards</a></li>
            <li><a href="/settings">⚙️ Settings</a></li>
        </ul>
    </aside>
    <main class="dashboard-main">
        <div class="dashboard-header">
            <h1>Edit Employee</h1>
        </div>
        <div style="background: var(--color-background-card); padding: var(--spacing-xl); border-radius: var(--radius-lg); border: 1px solid var(--color-border);">
            <form id="editEmployeeForm">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: var(--spacing-lg);">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: var(--spacing-lg); padding: 1rem;">Save Changes</button>
            </form>
        </div>
    </main>
</div>
{% endblock %}
