{% extends "base.html" %}
{% block title %}Forgot Password - Saurellius{% endblock %}
{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding-top: 60px;">
    <div class="container container-sm">
        <div class="form-container">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h2>Forgot Password?</h2>
                <p>Enter your email address and we'll send you a link to reset your password.</p>
            </div>
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">Send Reset Link</button>
            </form>
            <div style="text-align: center; margin-top: 2rem;">
                <p style="color: var(--color-text-secondary);">Remember your password?</p>
                <a href="/login" class="btn btn-secondary" style="width: 100%; padding: 1rem;">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
