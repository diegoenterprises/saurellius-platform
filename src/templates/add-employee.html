{% extends "base.html" %}
{% block title %}Add Employee - Saurellius{% endblock %}
{% block content %}
<div class="dashboard-wrapper">
    <aside class="dashboard-sidebar">
        <ul class="sidebar-menu">
            <li><a href="/dashboard">📊 Dashboard</a></li>
            <li><a href="/paystub-generator">🚀 Generate Paystub</a></li>
            <li><a href="/paystub-history">📄 History</a></li>
            <li><a href="/ytd-summary">📈 YTD Summary</a></li>
            <li><a href="/rewards">🏆 Rewards</a></li>
            <li><a href="/settings">⚙️ Settings</a></li>
        </ul>
    </aside>
    <main class="dashboard-main">
        <div class="dashboard-header">
            <h1>Add Employee</h1>
        </div>
        <div style="background: var(--color-background-card); padding: var(--spacing-xl); border-radius: var(--radius-lg); border: 1px solid var(--color-border);">
            <form id="addEmployeeForm">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: var(--spacing-lg);">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                    <div class="form-group">
                        <label for="employmentType">Employment Type</label>
                        <select id="employmentType" name="employmentType" required>
                            <option value="Full-Time">Full-Time</option>
                            <option value="Part-Time">Part-Time</option>
                            <option value="Contract">Contract</option>
                            <option value="Self-Employed">Self-Employed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="state">State</label>
                        <select id="state" name="state" required>
                            <option value="CA">California</option>
                            <option value="NY">New York</option>
                            <option value="TX">Texas</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: var(--spacing-lg); padding: 1rem;">Add Employee</button>
            </form>
        </div>
    </main>
</div>
{% endblock %}
