<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Saurellius Cloud Payroll Stub Manager by Dr. Paystub Corp</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/img/logo.png">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-content">
                <div class="logo-container">
                    <img src="/img/logo.webp" alt="Saurellius Logo">
                    <span class="logo-text">Saurellius</span>
                    <span style="font-size: 0.75rem; color: var(--color-text-secondary); margin-left: 0.5rem;">by Dr. Paystub Corp</span>
                </div>
                <div class="nav-links">
                    <a href="/">Home</a>
                    <a href="/#pricing">Pricing</a>
                </div>
                <div class="nav-buttons">
                    <a href="/register" class="btn btn-primary btn-sm">Create Account</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding-top: 60px;">
        <div class="container container-sm">
            <div class="form-container">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <img src="/img/logo.webp" alt="Saurellius" style="height: 50px; margin-bottom: 1rem;">
                    <h2>Welcome Back</h2>
                    <p>Sign in to your Saurellius account</p>
                </div>

                <form id="loginForm" method="POST" action="/api/auth/login">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" name="remember" style="width: 18px; height: 18px; cursor: pointer;">
                            <span style="font-size: 0.9rem;">Remember me</span>
                        </label>
                        <a href="/forgot-password" class="form-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">Sign In</button>
                </form>

                <div style="text-align: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--color-border);">
                    <p style="color: var(--color-text-secondary); margin-bottom: 1rem;">Don't have an account?</p>
                    <a href="/register" class="btn btn-secondary" style="width: 100%; padding: 1rem;">Create Account</a>
                </div>

                <div style="text-align: center; margin-top: 2rem;">
                    <p style="font-size: 0.85rem; color: var(--color-text-secondary);">
                        By signing in, you agree to our <a href="/terms" class="form-link">Terms of Service</a> and <a href="/privacy" class="form-link">Privacy Policy</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    window.location.href = '/dashboard';
                } else {
                    const error = await response.json();
                    alert('Login failed: ' + (error.message || 'Unknown error'));
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
